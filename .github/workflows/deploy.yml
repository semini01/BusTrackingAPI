name: Deploy to EC2

on:
  push:
    branches:
      - prod # Runs when you push to the prod branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }} # Your EC2 public IP
          username: ${{ secrets.EC2_USER }} # ec2-user
          key: ${{ secrets.EC2_SSH_KEY }} # Your .pem key contents
          script: |
            # Go to app folder (create if missing)
            mkdir -p /home/${{ secrets.EC2_USER }}/myapp
            cd /home/${{ secrets.EC2_USER }}/myapp

            # Install git, node, pm2 if not already installed
            if ! command -v git &> /dev/null; then
              sudo yum update -y
              sudo yum install -y git
            fi

            if ! command -v node &> /dev/null; then
              curl -fsSL https://rpm.nodesource.com/setup_18.x | sudo bash -
              sudo yum install -y nodejs
            fi

            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            # Clone repo if not exists, else pull latest
            if [ -d .git ]; then
              git reset --hard
              git pull origin prod
            else
              git clone -b prod https://semini01:${{ secrets.GH_TOKEN }}@github.com/semini01/BusTrackingAPI.git .
            fi

            # Install dependencies
            npm install

            # Restart app with PM2
            pm2 restart all || pm2 start index.js --name "BusTrackingAPI"
